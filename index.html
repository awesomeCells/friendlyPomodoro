<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            transition: background-color 0.8s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }
        .phase-work { background-color: #ffedeb; } /* Pastel Coral */
        .phase-short { background-color: #f0fdf4; } /* Pastel Mint */
        .phase-long { background-color: #eff6ff; } /* Pastel Blue */
        
        /* The Layout Fix */
        .timer-display-wrapper {
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: baseline;
            /* tabular-nums handles digit-to-digit spacing if the font supports it */
            font-variant-numeric: tabular-nums; 
            letter-spacing: -0.02em;
        }

        .timer-segment {
            display: inline-block;
            /* Using 'em' relative to the 8xl font size ensures enough space for 2 digits */
            width: 1.3em; 
        }
        
        .timer-segment.minutes { text-align: right; }
        .timer-segment.seconds { text-align: left; }

        .colon-box {
            display: inline-block;
            text-align: center;
            width: 0.3em;
            opacity: 0.4;
        }

        .cycle-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cycle-dot.active {
            transform: scale(1.4);
        }
        
        .btn-control {
            @apply p-4 text-gray-400 hover:text-gray-600 transition-all active:scale-90;
        }

        #extend-btn {
            transition: all 0.3s ease;
        }
        #extend-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
        }
    </style>
</head>
<body class="phase-work min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-sm p-10 text-center space-y-10 border border-white/40">
        <!-- Header -->
        <div class="space-y-1">
            <h1 id="phase-label" class="text-xl font-bold text-gray-700 tracking-widest uppercase">Focus Time</h1>
            <p id="cycle-description" class="text-sm text-gray-400 font-medium">Session 1 of 4</p>
        </div>

        <!-- Timer Display -->
        <div class="relative py-4">
            <div class="timer-display-wrapper text-8xl text-gray-800" id="timer-display">
                <span id="mins" class="timer-segment minutes">25</span><span class="colon-box">:</span><span id="secs" class="timer-segment seconds">00</span>
            </div>
            
            <button id="extend-btn" onclick="extendBreak()" class="hidden absolute -bottom-4 left-1/2 -translate-x-1/2 px-5 py-1.5 bg-white/90 rounded-full text-[10px] font-bold text-gray-400 hover:text-gray-600 hover:shadow-md transition-all border border-gray-100 uppercase tracking-tighter">
                +5 Min Break
            </button>
        </div>

        <!-- Cycle Dots -->
        <div class="flex justify-center space-x-4 items-center h-4">
            <div id="dot-1" class="cycle-dot"></div>
            <div id="dot-2" class="cycle-dot"></div>
            <div id="dot-3" class="cycle-dot"></div>
            <div id="dot-4" class="cycle-dot"></div>
        </div>

        <!-- Primary Controls -->
        <div class="flex items-center justify-center space-x-8">
            <button onclick="handlePrev()" class="btn-control" title="Previous Phase">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>

            <button id="play-pause-btn" onclick="toggleTimer()" class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center shadow-sm hover:shadow-xl transition-all active:scale-95 text-gray-700 border border-gray-50">
                <div id="play-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div id="pause-icon" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>
            </button>

            <button onclick="handleNext()" class="btn-control" title="Next Phase">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>

        <!-- Utilities -->
        <div class="pt-4">
            <button onclick="resetApp()" class="text-[10px] font-bold uppercase tracking-widest text-gray-300 hover:text-gray-500 transition-colors">
                Reset Progress
            </button>
        </div>
    </div>

    <script>
        const WORK_TIME = 25 * 60;
        const SHORT_BREAK = 5 * 60;
        const LONG_BREAK = 30 * 60;
        const EXTENSION_TIME = 5 * 60;

        let timeLeft = WORK_TIME;
        let endTime = null;
        let timerId = null;
        let isRunning = false;
        let cycleIndex = 0;
        let phase = 'work';
        let audioCtx = null;

        const minDisplay = document.getElementById('mins');
        const secDisplay = document.getElementById('secs');
        const phaseLabel = document.getElementById('phase-label');
        const cycleDesc = document.getElementById('cycle-description');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const extendBtn = document.getElementById('extend-btn');
        const body = document.body;

        function updateUI() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            
            minDisplay.textContent = m.toString().padStart(2, '0');
            secDisplay.textContent = s.toString().padStart(2, '0');

            document.title = `${minDisplay.textContent}:${secDisplay.textContent} - Pomodoro`;

            body.classList.remove('phase-work', 'phase-short', 'phase-long');

            if (phase === 'work') {
                phaseLabel.textContent = "Focus Time";
                body.classList.add('phase-work');
                cycleDesc.textContent = `Session ${cycleIndex + 1} of 4`;
                extendBtn.classList.add('hidden');
            } else {
                const isLong = cycleIndex === 3;
                phaseLabel.textContent = isLong ? "Deep Rest" : "Short Break";
                body.classList.add(isLong ? 'phase-long' : 'phase-short');
                cycleDesc.textContent = isLong ? "Set Complete" : "Refresh & Breathe";
                extendBtn.classList.remove('hidden');
            }

            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i + 1}`);
                if (i < cycleIndex) {
                    dot.style.backgroundColor = '#9ca3af';
                    dot.classList.add('active');
                } else if (i === cycleIndex) {
                    dot.style.backgroundColor = phase === 'work' ? '#f87171' : '#4ade80';
                    dot.classList.add('active');
                } else {
                    dot.style.backgroundColor = '#e5e7eb';
                    dot.classList.remove('active');
                }
            }

            playIcon.classList.toggle('hidden', isRunning);
            pauseIcon.classList.toggle('hidden', !isRunning);
        }

        function playChime() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.15, start + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + duration);
            };
            if (phase === 'break') {
                playNote(523.25, now, 0.5); 
                playNote(659.25, now + 0.12, 0.5);
            } else {
                playNote(659.25, now, 0.5);
                playNote(523.25, now + 0.12, 0.5);
            }
        }

        function toggleTimer() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (isRunning) {
                clearInterval(timerId);
                timeLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                isRunning = false;
            } else {
                isRunning = true;
                endTime = Date.now() + (timeLeft * 1000);
                timerId = setInterval(() => {
                    const now = Date.now();
                    
                    if (now >= endTime) {
                        playChime();
                        
                        // Handles immediate transitions and extreme background drift
                        while (now >= endTime) {
                            if (phase === 'work') {
                                phase = 'break';
                                timeLeft = (cycleIndex === 3) ? LONG_BREAK : SHORT_BREAK;
                            } else {
                                phase = 'work';
                                cycleIndex = (cycleIndex + 1) % 4;
                                timeLeft = WORK_TIME;
                            }
                            // Append exact time to maintain continuous perfect accuracy
                            endTime += (timeLeft * 1000);
                        }
                        
                        timeLeft = Math.ceil((endTime - now) / 1000);
                        updateUI();
                    } else {
                        const remaining = Math.ceil((endTime - now) / 1000);
                        if (remaining !== timeLeft) {
                            timeLeft = remaining;
                            updateUI();
                        }
                    }
                }, 100);
            }
            updateUI();
        }

        function extendBreak() {
            if (phase === 'break') {
                timeLeft += EXTENSION_TIME;
                if (isRunning) endTime += (EXTENSION_TIME * 1000);
                updateUI();
            }
        }

        function handleNext() {
            if (phase === 'work') {
                phase = 'break';
                timeLeft = (cycleIndex === 3) ? LONG_BREAK : SHORT_BREAK;
            } else {
                phase = 'work';
                cycleIndex = (cycleIndex + 1) % 4;
                timeLeft = WORK_TIME;
            }
            if (isRunning) endTime = Date.now() + (timeLeft * 1000);
            updateUI();
        }

        function handlePrev() {
            if (phase === 'break') {
                phase = 'work';
                timeLeft = WORK_TIME;
            } else {
                if (cycleIndex > 0) {
                    cycleIndex--;
                    phase = 'break';
                    timeLeft = (cycleIndex === 3) ? LONG_BREAK : SHORT_BREAK;
                } else {
                    timeLeft = WORK_TIME;
                }
            }
            if (isRunning) endTime = Date.now() + (timeLeft * 1000);
            updateUI();
        }

        function resetApp() {
            clearInterval(timerId);
            isRunning = false;
            cycleIndex = 0;
            phase = 'work';
            timeLeft = WORK_TIME;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
