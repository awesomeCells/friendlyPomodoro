<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            transition: background-color 0.8s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .phase-work { background-color: #ffedeb; } /* Pastel Coral */
        .phase-short { background-color: #f0fdf4; } /* Pastel Mint */
        .phase-long { background-color: #eff6ff; } /* Pastel Blue */
        
        .timer-text {
            /* tabular-nums ensures digits have equal width */
            font-variant-numeric: tabular-nums;
            font-weight: 300;
            /* Using a monospace fallback for the timer to ensure perfect stability */
            font-family: 'Quicksand', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: inline-block;
            min-width: 320px; /* Prevents the container from shifting */
            text-align: center;
        }

        .cycle-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .cycle-dot.active {
            transform: scale(1.3);
            background-color: #4b5563;
        }
        .cycle-dot.inactive {
            background-color: #d1d5db;
        }
        
        #extend-btn {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #extend-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="phase-work min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 text-center space-y-8">
        <!-- Header -->
        <div>
            <h1 id="phase-label" class="text-2xl font-bold text-gray-700 tracking-wide uppercase">Focus Time</h1>
            <p id="cycle-description" class="text-sm text-gray-500 mt-1">Session 1 of 4</p>
        </div>

        <!-- Timer Display -->
        <div class="relative flex justify-center items-center">
            <div class="timer-text text-8xl text-gray-800 py-4" id="timer-display">
                25:00
            </div>
            <!-- Extend Break Button -->
            <button id="extend-btn" onclick="extendBreak()" class="hidden absolute -bottom-2 left-1/2 -translate-x-1/2 px-4 py-1 bg-white/80 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 hover:bg-white transition-all shadow-sm border border-gray-100">
                +5 MIN BREAK
            </button>
        </div>

        <!-- Cycle Indicator -->
        <div class="flex justify-center space-x-3 items-center">
            <div id="dot-1" class="cycle-dot inactive"></div>
            <div id="dot-2" class="cycle-dot inactive"></div>
            <div id="dot-3" class="cycle-dot inactive"></div>
            <div id="dot-4" class="cycle-dot inactive"></div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center space-x-6">
            <button onclick="handlePrev()" class="p-3 text-gray-400 hover:text-gray-600 transition-colors" title="Previous Phase">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>

            <button id="play-pause-btn" onclick="toggleTimer()" class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all active:scale-95 text-gray-700">
                <div id="play-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div id="pause-icon" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>
            </button>

            <button onclick="handleNext()" class="p-3 text-gray-400 hover:text-gray-600 transition-colors" title="Next Phase">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>

        <!-- Reset -->
        <button onclick="resetApp()" class="text-xs uppercase tracking-widest text-gray-400 hover:text-gray-600 transition-colors pt-4">
            Reset All Cycles
        </button>
    </div>

    <script>
        // Configuration
        const WORK_TIME = 25 * 60;
        const SHORT_BREAK = 5 * 60;
        const LONG_BREAK = 30 * 60;
        const EXTENSION_TIME = 5 * 60;

        // State
        let timeLeft = WORK_TIME;
        let timerId = null;
        let isRunning = false;
        let cycleIndex = 0;
        let phase = 'work';
        let audioCtx = null;

        // Elements
        const display = document.getElementById('timer-display');
        const phaseLabel = document.getElementById('phase-label');
        const cycleDesc = document.getElementById('cycle-description');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const extendBtn = document.getElementById('extend-btn');
        const body = document.body;

        function updateUI() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.title = `${display.textContent} - Pomodoro`;

            if (phase === 'work') {
                phaseLabel.textContent = "Focus Time";
                body.className = "phase-work min-h-screen flex items-center justify-center p-4";
                cycleDesc.textContent = `Session ${cycleIndex + 1} of 4`;
                extendBtn.classList.add('hidden');
            } else {
                const isLong = cycleIndex === 3;
                phaseLabel.textContent = isLong ? "Deep Rest" : "Short Break";
                body.className = isLong ? "phase-long min-h-screen flex items-center justify-center p-4" : "phase-short min-h-screen flex items-center justify-center p-4";
                cycleDesc.textContent = isLong ? "End of cycle set" : "Time to stretch";
                extendBtn.classList.remove('hidden');
            }

            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i + 1}`);
                if (i < cycleIndex) {
                    dot.style.backgroundColor = '#4b5563';
                    dot.classList.add('active');
                } else if (i === cycleIndex) {
                    dot.style.backgroundColor = phase === 'work' ? '#fca5a5' : '#86efac';
                    dot.classList.add('active');
                } else {
                    dot.style.backgroundColor = '#d1d5db';
                    dot.classList.remove('active');
                }
            }

            if (isRunning) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function playChime() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const now = audioCtx.currentTime;
            
            const playNote = (freq, start, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle'; // Gentle sound
                osc.frequency.setValueAtTime(freq, start);
                
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.2, start + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(start);
                osc.stop(start + duration);
            };

            // Friendly two-note chime
            if (phase === 'break') {
                // Ascending for break start
                playNote(523.25, now, 0.6); // C5
                playNote(659.25, now + 0.15, 0.6); // E5
            } else {
                // Descending for work start
                playNote(659.25, now, 0.6); // E5
                playNote(523.25, now + 0.15, 0.6); // C5
            }
        }

        function toggleTimer() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
            } else {
                isRunning = true;
                timerId = setInterval(() => {
                    timeLeft--;
                    if (timeLeft < 0) {
                        handleNext();
                        playChime();
                        playVisualAlert();
                    }
                    updateUI();
                }, 1000);
            }
            updateUI();
        }

        function extendBreak() {
            if (phase === 'break') {
                timeLeft += EXTENSION_TIME;
                updateUI();
            }
        }

        function handleNext() {
            if (phase === 'work') {
                phase = 'break';
                timeLeft = (cycleIndex === 3) ? LONG_BREAK : SHORT_BREAK;
            } else {
                phase = 'work';
                cycleIndex = (cycleIndex + 1) % 4;
                timeLeft = WORK_TIME;
            }
            updateUI();
        }

        function handlePrev() {
            if (phase === 'break') {
                phase = 'work';
                timeLeft = WORK_TIME;
            } else {
                if (cycleIndex > 0) {
                    cycleIndex--;
                    phase = 'break';
                    timeLeft = (cycleIndex === 3) ? LONG_BREAK : SHORT_BREAK;
                } else {
                    timeLeft = WORK_TIME;
                }
            }
            updateUI();
        }

        function resetApp() {
            clearInterval(timerId);
            isRunning = false;
            cycleIndex = 0;
            phase = 'work';
            timeLeft = WORK_TIME;
            updateUI();
        }

        function playVisualAlert() {
            let flashes = 0;
            const interval = setInterval(() => {
                document.title = flashes % 2 === 0 ? "🔔 TIME'S UP!" : "00:00 - Pomodoro";
                if (++flashes > 10) {
                    clearInterval(interval);
                    updateUI();
                }
            }, 500);
        }

        updateUI();
    </script>
</body>
</html>
